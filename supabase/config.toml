# Supabase CLI configuration for local development
# Reference: https://supabase.com/docs/guides/local-development

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]

[db]
port = 54322

[studio]
port = 54323

[inbucket]
port = 54324

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.email.template.confirmation]
subject = "E-Mail-Adresse für Quoska bestätigen"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "Deine Einladung zu Quoska"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Quoska-Passwort zurücksetzen"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Neue E-Mail-Adresse für Quoska bestätigen"
content_path = "./supabase/templates/email-change.html"

[storage]
file_size_limit = "50MiB"
