name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit + typecheck + lint ──────────────────────────────────────────────
  # The core gate: fast (~1 min), no external services needed. This is what
  # must stay green on every push.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      # Billing tested in no-keys mode (the open-source / self-host path).
      # Striped empty so the zod schema's .optional() allows them through.
      STRIPE_SECRET_KEY: ""
      STRIPE_TEAM_PRICE_ID: ""
      STRIPE_TEAM_LEGACY_PRICE_IDS: ""
      STRIPE_BUSINESS_PRICE_ID: ""
      STRIPE_BUSINESS_LEGACY_PRICE_IDS: ""
      STRIPE_PRO_PRICE_ID: ""
      STRIPE_PRO_LEGACY_PRICE_IDS: ""
      STRIPE_TEAM_FOUNDER_PROMOTION_CODE_ID: ""
      STRIPE_BUSINESS_FOUNDER_PROMOTION_CODE_ID: ""
      STRIPE_PRO_FOUNDER_PROMOTION_CODE_ID: ""
      STRIPE_WEBHOOK_SECRET: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Custom legal-compliance ESLint rules
        run: node tools/eslint-rules/run-tests.mjs

      - name: Unit + integration tests
        run: npm test

      - name: Production build
        run: npm run build

  # ── Production container ────────────────────────────────────────────────
  # Validates that the standalone Next.js output can be packaged without
  # passing any server secret into the image build.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: quoska:ci
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED=
            GOOGLE_SITE_VERIFICATION=
            APP_REVISION=${{ github.sha }}

  # ── End-to-end (Playwright) ──────────────────────────────────────────────
  # Boots a local Supabase stack + the app, then runs the Playwright suite.
  # This is a required merge gate: deployment must not proceed when a real
  # browser flow or the local database setup fails.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      BROWSER_EXTENSION_IDS: abcdefghijklmnopabcdefghijklmnop
      CRON_SECRET: ci-cron-secret-with-at-least-32-characters
      STRIPE_SECRET_KEY: ""
      STRIPE_TEAM_PRICE_ID: ""
      STRIPE_TEAM_LEGACY_PRICE_IDS: ""
      STRIPE_BUSINESS_PRICE_ID: ""
      STRIPE_BUSINESS_LEGACY_PRICE_IDS: ""
      STRIPE_PRO_PRICE_ID: ""
      STRIPE_PRO_LEGACY_PRICE_IDS: ""
      STRIPE_TEAM_FOUNDER_PROMOTION_CODE_ID: ""
      STRIPE_BUSINESS_FOUNDER_PROMOTION_CODE_ID: ""
      STRIPE_PRO_FOUNDER_PROMOTION_CODE_ID: ""
      STRIPE_WEBHOOK_SECRET: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Local Supabase stack — the CLI boots the full Docker stack and creates
      # a fresh publishable/secret key pair for this run.
      - name: Setup Supabase
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase credentials for the app
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Apply migrations
        run: supabase db push --local

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
